// App 模块构建脚本：JNI 外源构建（ame_jni/CMakeLists.txt）+ Kotlin Android 常规配置。
// 关键点：
//   - externalNativeBuild 指向 ../ame_jni/CMakeLists.txt（AGP 注入 NDK 工具链）；
//   - ABI 只打 arm64-v8a（减小体积，真机主流）；
//   - MiniMax key 从 local.properties（gitignore）读入 BuildConfig，代码/日志不落 key。
plugins {
    id 'com.android.application'
}

// local.properties：sdk.dir 由 AGP 自读；这里只取自定义项（MINIMAX_API_KEY 等）
def lp = new Properties()
def lpFile = rootProject.file('local.properties')
if (lpFile.exists()) lpFile.withInputStream { lp.load(it) }

// 关键词词典打包：构建期从仓库 lexicon 资产拷贝 67.8 万词分词词表进 APK assets
// （不进源码树；首次运行再由 App 拷到私有目录并建 AC 缓存，多 session 共享同一份）。
tasks.register('copyKeywordDict', Copy) {
    from('../../lexicon/lexicon_src/segmentation') { include 'merged.txt' }
    into layout.buildDirectory.dir('generated-assets')
}
preBuild.dependsOn 'copyKeywordDict'

android {
    namespace 'com.ame.memory'
    compileSdk 34
    ndkVersion '27.0.12077973'

    defaultConfig {
        applicationId "com.ame.memory"
        minSdk 26
        targetSdk 34
        versionCode 2
        versionName "2.0-dev"
        buildConfigField "String", "MINIMAX_API_KEY", "\"${lp.getProperty('MINIMAX_API_KEY', '')}\""
        buildConfigField "String", "MINIMAX_BASE_URL", "\"${lp.getProperty('MINIMAX_BASE_URL', 'https://api.minimaxi.com/v1')}\""
        buildConfigField "String", "MINIMAX_MODEL", "\"${lp.getProperty('MINIMAX_MODEL', 'MiniMax-M3')}\""
        // 装配上限（可调，状态栏同步显示）：滑窗消息条数 + recall 证据条数
        // 滑窗默认 8 条 = 4 轮对话：recall 修复后更早历史靠证据取证，窗口过长浪费 token
        buildConfigField "int", "CONTEXT_WINDOW_TURNS", "${lp.getProperty('CONTEXT_WINDOW_TURNS', '8')}"
        buildConfigField "int", "RECALL_TOP_K", "${lp.getProperty('RECALL_TOP_K', '5')}"
        // 记忆后端开关：graph=1.x 图引擎（graph.json 快照）| lmem=2.0 分层记忆
        // （观测 append-only 落盘，首次打开自动迁移旧 graph.json）。默认 graph。
        buildConfigField "String", "MEM_STORE", "\"${lp.getProperty('MEM_STORE', 'graph')}\""
        externalNativeBuild {
            cmake {
                cppFlags "-std=c++17"
                abiFilters 'arm64-v8a'
            }
        }
    }

    buildTypes {
        debug { minifyEnabled false }
        release { minifyEnabled false }
    }

    externalNativeBuild {
        cmake {
            path file('../ame_jni/CMakeLists.txt')
            version '3.22.1'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    buildFeatures { buildConfig true }
    // 构建期生成的 assets 目录（关键词词表）
    sourceSets.main.assets.srcDir layout.buildDirectory.dir('generated-assets')
}

dependencies {
    implementation 'androidx.core:core-ktx:1.13.1'
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    implementation 'org.json:json:20240303'
    // 导游模式：PDF 文本/内嵌图提取（纯 JVM 解析，不联网）
    implementation 'com.tom-roush:pdfbox-android:2.0.27.0'
}
